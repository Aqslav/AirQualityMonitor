name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Автотести з покриттям
        run: dotnet test AirQualityMonitor.Tests --collect:"XPlat Code Coverage" --settings AirQualityMonitor.Tests/coverlet.runsettings --results-directory ./coverage

      - name: Звіт про покриття
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/report -reporttypes:"TextSummary;Html"
          cat coverage/report/Summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report
